[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-visual-memory"
version = "0.1.0"
description = "Visual memory and explainable graph retrieval with Neo4j"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic==2.12.5", "numpy==2.2.6", "Pillow==11.3.0", "requests==2.32.5",
  "tqdm==4.67.1", "PyYAML==6.0.3", "openai==2.8.1", "neo4j==5.28.2",
  "python-dotenv==1.2.1", "pandas==2.3.3", "ipywidgets==8.1.8",
  "matplotlib==3.10.7", "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab==4.4.10", "ipykernel==6.30.1", "nbformat==5.10.4", "nbclient==0.10.2"]
test = ["pytest==8.4.2", "nbformat==5.10.4", "nbclient==0.10.2", "ruff==0.14.6"]

[project.scripts]
rvm = "rvm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires running Neo4j", "real: requires a real compact export"]

[tool.ruff]
line-length = 110
